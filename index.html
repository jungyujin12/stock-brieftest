<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockBrief — 관심종목 분석기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Nanum+Gothic+Coding:wght@400;700&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f2eb;
  --ink: #1a1410;
  --ink2: #4a3f35;
  --muted: #9a8f85;
  --rule: #d8d0c4;
  --card: #faf8f4;
  --accent: #c84b2f;
  --accent2: #2f6bc8;
  --good: #1a7a3c;
  --bad: #b82020;
  --warn: #c87a10;
  --tag-bg: #ede9e2;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(90deg,transparent,transparent calc(100%/12 - 1px),rgba(26,20,16,.03) calc(100%/12 - 1px),rgba(26,20,16,.03) calc(100%/12));pointer-events:none;z-index:0}

/* MASTHEAD */
.masthead{position:relative;z-index:10;border-bottom:3px double var(--ink);padding:0 24px;background:var(--bg)}
.masthead-top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;border-bottom:1px solid var(--rule);gap:12px;flex-wrap:wrap}
.paper-name{font-family:'Syne',sans-serif;font-weight:800;font-size:1.6rem;letter-spacing:-.02em;color:var(--ink);line-height:1;flex-shrink:0}
.paper-name span{color:var(--accent)}
.masthead-meta{font-family:'Nanum Gothic Coding',monospace;font-size:.6rem;color:var(--muted);text-align:right;line-height:1.6}
.api-status{display:flex;align-items:center;gap:6px;font-family:'Nanum Gothic Coding',monospace;font-size:.65rem;color:var(--good)}

/* LAYOUT */
.layout{position:relative;z-index:1;display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 90px)}

/* SIDEBAR */
.sidebar{border-right:1px solid var(--rule);padding:20px 16px;display:flex;flex-direction:column;gap:0;background:var(--bg);overflow-y:auto;max-height:calc(100vh - 90px);position:sticky;top:0}
.sidebar-title{font-family:'Syne',sans-serif;font-weight:700;font-size:.68rem;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--rule);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.refresh-all-btn{background:none;border:1px solid var(--rule);color:var(--muted);font-family:'Nanum Gothic Coding',monospace;font-size:.58rem;padding:3px 8px;cursor:pointer;transition:all .2s}
.refresh-all-btn:hover{border-color:var(--accent);color:var(--accent)}

/* SECTOR FILTER */
.sector-filter{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.sector-btn{background:none;border:1px solid var(--rule);color:var(--muted);font-family:'Nanum Gothic Coding',monospace;font-size:.58rem;padding:3px 8px;cursor:pointer;transition:all .15s;border-radius:2px}
.sector-btn.active{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ADD FORM */
.add-form{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;padding:10px;background:var(--tag-bg);border:1px solid var(--rule)}
.add-row{display:flex;gap:6px}
.add-name,.add-code{background:var(--bg);border:1px solid var(--rule);color:var(--ink);font-family:'Pretendard',sans-serif;font-size:.78rem;padding:6px 8px;outline:none;transition:border-color .2s}
.add-name{flex:1}.add-name:focus,.add-code:focus{border-color:var(--ink)}
.add-code{width:72px;font-family:'Nanum Gothic Coding',monospace;font-size:.72rem}
.add-sector{width:100%;background:var(--bg);border:1px solid var(--rule);color:var(--ink);font-family:'Pretendard',sans-serif;font-size:.75rem;padding:5px 8px;outline:none;cursor:pointer}
.add-btn{background:var(--ink);color:var(--bg);border:none;font-size:1rem;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
.add-btn:hover{background:var(--accent)}

/* WATCHLIST */
.watchlist{display:flex;flex-direction:column;gap:2px;flex:1}
.stock-item{display:flex;align-items:center;padding:9px 10px;cursor:pointer;border-left:3px solid transparent;transition:all .15s;border-radius:0 2px 2px 0;gap:8px}
.stock-item:hover{background:var(--tag-bg)}
.stock-item.active{border-left-color:var(--accent);background:var(--tag-bg)}
.stock-item-info{flex:1;min-width:0}
.stock-item-name{font-weight:600;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock-item-meta{display:flex;align-items:center;gap:6px;margin-top:2px}
.stock-item-code{font-family:'Nanum Gothic Coding',monospace;font-size:.58rem;color:var(--muted)}
.stock-item-sector{font-family:'Nanum Gothic Coding',monospace;font-size:.55rem;color:var(--bg);background:var(--muted);padding:1px 5px;border-radius:2px}
.stock-item-status{font-family:'Nanum Gothic Coding',monospace;font-size:.55rem;color:var(--muted);white-space:nowrap;flex-shrink:0}
.stock-item-actions{display:flex;gap:2px;flex-shrink:0}
.stock-item-btn{background:none;border:none;color:var(--rule);font-size:.85rem;cursor:pointer;padding:2px 3px;line-height:1;transition:color .15s}
.stock-item-btn:hover{color:var(--bad)}
.stock-item-btn.memo:hover{color:var(--accent2)}
.empty-state{text-align:center;padding:28px 12px;color:var(--muted);font-size:.72rem;line-height:1.8;border:1px dashed var(--rule)}

/* CONTENT */
.content{padding:24px 32px;display:flex;flex-direction:column;gap:0;overflow-y:auto}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:400px;gap:16px;color:var(--muted);text-align:center}
.welcome-icon{font-size:3rem;opacity:.3}
.welcome h2{font-family:'Syne',sans-serif;font-size:1rem;color:var(--ink2);font-weight:600}
.welcome p{font-size:.78rem;line-height:1.7;max-width:280px}

/* ARTICLE HEAD */
.article-head{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px}
.article-eyebrow{font-family:'Nanum Gothic Coding',monospace;font-size:.6rem;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}
.article-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem;line-height:1.1;color:var(--ink);margin-bottom:8px;letter-spacing:-.02em}
.article-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:'Nanum Gothic Coding',monospace;font-size:.6rem;color:var(--muted)}
.refresh-btn{background:var(--ink);color:var(--bg);border:none;font-family:'Syne',sans-serif;font-size:.7rem;font-weight:600;letter-spacing:.08em;padding:7px 18px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;margin-left:auto}
.refresh-btn:hover{background:var(--accent)}
.refresh-btn:disabled{background:var(--rule);color:var(--muted);cursor:not-allowed}

/* COLUMNS */
.columns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px}
.col-header{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:14px}
.col-icon{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;flex-shrink:0}
.col-icon.neutral{background:var(--ink);color:var(--bg)}
.col-icon.good{background:var(--good);color:#fff}
.col-icon.bad{background:var(--bad);color:#fff}
.col-icon.dart{background:var(--accent2);color:#fff}
.col-title{font-family:'Syne',sans-serif;font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em}
.col-title.neutral{color:var(--ink)}.col-title.good{color:var(--good)}.col-title.bad{color:var(--bad)}.col-title.dart{color:var(--accent2)}
.news-items{display:flex;flex-direction:column;gap:12px}
.news-item{padding-bottom:12px;border-bottom:1px solid var(--rule)}
.news-item:last-child{border-bottom:none;padding-bottom:0}
.news-headline{font-size:.78rem;font-weight:600;color:var(--ink);line-height:1.4;margin-bottom:4px}
.news-desc{font-size:.7rem;color:var(--ink2);line-height:1.6}
.news-tag{display:inline-block;background:var(--tag-bg);color:var(--muted);font-family:'Nanum Gothic Coding',monospace;font-size:.55rem;padding:1px 6px;margin-top:4px;letter-spacing:.05em}
.news-tag.good{background:#e8f5ec;color:var(--good)}
.news-tag.bad{background:#fdf0f0;color:var(--bad)}
.news-tag.dart{background:#e8eef8;color:var(--accent2)}

/* HISTORY */
.history-section{margin-top:16px;border-top:1px solid var(--rule);padding-top:14px}
.history-title{font-family:'Nanum Gothic Coding',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px}
.history-list{display:flex;flex-direction:column;gap:6px}
.history-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--tag-bg);border:1px solid var(--rule);cursor:pointer;transition:border-color .15s}
.history-item:hover{border-color:var(--ink)}
.history-date{font-family:'Nanum Gothic Coding',monospace;font-size:.6rem;color:var(--muted);white-space:nowrap}
.history-summary{font-size:.72rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* MEMO */
.memo-section{margin-top:16px;border-top:1px solid var(--rule);padding-top:14px}
.memo-label{font-family:'Nanum Gothic Coding',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
.memo-input{width:100%;background:var(--tag-bg);border:1px solid var(--rule);color:var(--ink);font-family:'Pretendard',sans-serif;font-size:.78rem;line-height:1.6;padding:8px 10px;outline:none;resize:vertical;min-height:60px;transition:border-color .2s}
.memo-input:focus{border-color:var(--ink)}
.memo-save{background:none;border:1px solid var(--rule);color:var(--muted);font-family:'Nanum Gothic Coding',monospace;font-size:.6rem;padding:4px 12px;cursor:pointer;margin-top:6px;transition:all .2s}
.memo-save:hover{border-color:var(--ink);color:var(--ink)}

/* SUMMARY BAR */
.summary-bar{background:var(--ink);color:var(--bg);padding:12px 18px;margin-top:4px;display:flex;align-items:flex-start;gap:12px}
.summary-label{font-family:'Syne',sans-serif;font-weight:700;font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;white-space:nowrap;padding-top:1px;color:rgba(245,242,235,.5)}
.summary-text{font-size:.78rem;line-height:1.5;color:var(--bg)}
.updated-badge{font-family:'Nanum Gothic Coding',monospace;font-size:.58rem;color:var(--muted);margin-top:14px;text-align:right}

/* LOADING */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:16px;color:var(--muted)}
.loading-bar{width:200px;height:2px;background:var(--rule);overflow:hidden}
.loading-bar::after{content:'';display:block;width:40%;height:100%;background:var(--accent);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
.loading-text{font-family:'Nanum Gothic Coding',monospace;font-size:.65rem;letter-spacing:.1em}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:var(--bg);font-family:'Nanum Gothic Coding',monospace;font-size:.7rem;padding:10px 16px;z-index:999;transform:translateY(20px);opacity:0;transition:all .25s;border-left:3px solid var(--accent)}
.toast.show{transform:translateY(0);opacity:1}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--rule)}

/* MOBILE */
@media(max-width:768px){
  .layout{grid-template-columns:1fr}
  .sidebar{max-height:none;position:static;border-right:none;border-bottom:1px solid var(--rule)}
  .watchlist{flex-direction:row;flex-wrap:wrap;gap:6px}
  .stock-item{width:calc(50% - 3px);border-left:none;border-bottom:3px solid transparent}
  .stock-item.active{border-bottom-color:var(--accent)}
  .content{padding:16px}
  .columns{grid-template-columns:1fr}
  .article-title{font-size:1.3rem}
  .masthead{padding:0 16px}
  .paper-name{font-size:1.3rem}
}
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-top">
    <div class="paper-name">STOCK<span>BRIEF</span></div>
    <div class="masthead-meta" id="dateDisplay"></div>
    <div class="api-status">✓ Cloudflare Worker 연결됨</div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-title">
      관심종목
      <button class="refresh-all-btn" onclick="refreshAll()">↻ 전체갱신</button>
    </div>

    <!-- 업종 필터 -->
    <div class="sector-filter" id="sectorFilter">
      <button class="sector-btn active" onclick="filterSector('all', this)">전체</button>
    </div>

    <!-- 종목 추가 -->
    <div class="add-form">
      <div class="add-row">
        <input class="add-name" id="addName" placeholder="종목명" maxlength="20" onkeydown="if(event.key==='Enter')addStock()">
        <input class="add-code" id="addCode" placeholder="종목코드" maxlength="6" onkeydown="if(event.key==='Enter')addStock()">
        <button class="add-btn" onclick="addStock()">+</button>
      </div>
      <select class="add-sector" id="addSector">
        <option value="">업종 선택 (선택사항)</option>
        <option value="반도체">반도체</option>
        <option value="IT">IT</option>
        <option value="바이오">바이오</option>
        <option value="금융">금융</option>
        <option value="에너지">에너지</option>
        <option value="소비재">소비재</option>
        <option value="자동차">자동차</option>
        <option value="기타">기타</option>
      </select>
    </div>

    <div class="watchlist" id="watchlist"></div>
  </aside>

  <main class="content" id="content">
    <div class="welcome">
      <div class="welcome-icon">📰</div>
      <h2>관심종목을 선택하세요</h2>
      <p>좌측에서 종목을 추가하고 클릭하면<br>최신 뉴스·호재·악재를 분석합니다.</p>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ─────────────────────────────────────────────
const WORKER_URL = 'https://stock-api.jyj2315.workers.dev';
const MAX_HISTORY = 3; // 종목당 히스토리 최대 보관 수
const NEWS_MAX_AGE_DAYS = 7; // 뉴스 최대 7일 이내만

// ── STATE ──────────────────────────────────────────────
let watchlist = JSON.parse(localStorage.getItem('sb_watchlist') || '[]');
let memos = JSON.parse(localStorage.getItem('sb_memos') || '{}');
let history = JSON.parse(localStorage.getItem('sb_history') || '{}');
let activeId = null;
let activeSector = 'all';
let isLoading = false;
let cache = {};

// ── INIT ───────────────────────────────────────────────
(function init() {
  const now = new Date();
  document.getElementById('dateDisplay').textContent =
    now.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'short' }) +
    '\nNaver News + Groq AI';
  renderSectorFilter();
  renderWatchlist();
})();

// ── SECTOR FILTER ──────────────────────────────────────
function renderSectorFilter() {
  const sectors = ['전체', ...new Set(watchlist.map(s => s.sector).filter(Boolean))];
  const el = document.getElementById('sectorFilter');
  el.innerHTML = sectors.map(s =>
    `<button class="sector-btn${(s==='전체'&&activeSector==='all')||(s===activeSector)?' active':''}"
      onclick="filterSector('${s}', this)">${s}</button>`
  ).join('');
}

function filterSector(sector, el) {
  activeSector = sector === '전체' ? 'all' : sector;
  document.querySelectorAll('.sector-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderWatchlist();
}

// ── WATCHLIST ──────────────────────────────────────────
function addStock() {
  const name = document.getElementById('addName').value.trim();
  const code = document.getElementById('addCode').value.trim();
  const sector = document.getElementById('addSector').value;
  if (!name) { toast('종목명을 입력하세요.'); return; }
  if (watchlist.find(s => s.name === name)) { toast('이미 추가된 종목입니다.'); return; }

  const id = Date.now().toString();
  watchlist.push({ id, name, code, sector });
  saveWatchlist();
  document.getElementById('addName').value = '';
  document.getElementById('addCode').value = '';
  document.getElementById('addSector').value = '';
  renderSectorFilter();
  renderWatchlist();
  selectStock(id);
}

function removeStock(id, e) {
  e.stopPropagation();
  if (!confirm('종목을 삭제할까요?')) return;
  watchlist = watchlist.filter(s => s.id !== id);
  saveWatchlist();
  delete cache[id];
  delete memos[id];
  delete history[id];
  localStorage.setItem('sb_memos', JSON.stringify(memos));
  localStorage.setItem('sb_history', JSON.stringify(history));
  if (activeId === id) { activeId = null; showWelcome(); }
  renderSectorFilter();
  renderWatchlist();
}

function saveWatchlist() {
  localStorage.setItem('sb_watchlist', JSON.stringify(watchlist));
}

function renderWatchlist() {
  const el = document.getElementById('watchlist');
  const filtered = activeSector === 'all'
    ? watchlist
    : watchlist.filter(s => s.sector === activeSector);

  if (!filtered.length) {
    el.innerHTML = `<div class="empty-state">종목을 추가하면<br>여기에 표시됩니다.</div>`;
    return;
  }
  el.innerHTML = filtered.map(s => {
    const cached = cache[s.id];
    const status = cached ? timeSince(cached.updatedAt) : '';
    return `
    <div class="stock-item${s.id === activeId ? ' active' : ''}" onclick="selectStock('${s.id}')">
      <div class="stock-item-info">
        <div class="stock-item-name">${escHtml(s.name)}</div>
        <div class="stock-item-meta">
          ${s.code ? `<span class="stock-item-code">${escHtml(s.code)}</span>` : ''}
          ${s.sector ? `<span class="stock-item-sector">${escHtml(s.sector)}</span>` : ''}
        </div>
      </div>
      ${status ? `<span class="stock-item-status">${status}</span>` : ''}
      <div class="stock-item-actions">
        <button class="stock-item-btn memo" onclick="focusMemo('${s.id}',event)" title="메모">✏️</button>
        <button class="stock-item-btn" onclick="removeStock('${s.id}', event)" title="삭제">×</button>
      </div>
    </div>`;
  }).join('');
}

function selectStock(id) {
  activeId = id;
  renderWatchlist();
  const stock = watchlist.find(s => s.id === id);
  if (!stock) return;
  if (cache[id]) {
    renderResult(stock, cache[id].data, cache[id].updatedAt);
  } else {
    fetchAnalysis(stock);
  }
}

async function refreshAll() {
  const stocks = activeSector === 'all' ? watchlist : watchlist.filter(s => s.sector === activeSector);
  for (const s of stocks) {
    delete cache[s.id];
  }
  toast(`↻ ${stocks.length}개 종목 순차 갱신 중...`);
  for (const s of stocks) {
    activeId = s.id;
    renderWatchlist();
    await fetchAnalysis(s);
    await new Promise(r => setTimeout(r, 800)); // 요청 간격
  }
  toast('✓ 전체 갱신 완료');
}

// ── FETCH ──────────────────────────────────────────────
async function fetchAnalysis(stock) {
  if (isLoading) return;
  isLoading = true;
  showLoading(stock.name);

  try {
    // 네이버 뉴스: 종목명 + 코드 조합으로 정확도 향상
    const query = stock.code
      ? `${stock.name} ${stock.code}`
      : `${stock.name} 주식`;
    const newsRes = await fetch(`${WORKER_URL}/news?q=${encodeURIComponent(query)}`);
    const rawNews = newsRes.ok ? await newsRes.json() : { items: [] };

    // 뉴스 중복 제거 + 7일 필터
    const cutoff = Date.now() - NEWS_MAX_AGE_DAYS * 86400000;
    const seen = new Set();
    const newsData = {
      items: (rawNews.items || []).filter(n => {
        const pub = new Date(n.pubDate).getTime();
        if (pub < cutoff) return false; // 7일 초과 제거
        const key = n.title?.replace(/<[^>]+>/g,'').slice(0, 20);
        if (seen.has(key)) return false; // 중복 제거
        seen.add(key);
        return true;
      })
    };

    // DART 공시 수집 (종목명으로 직접 공시 검색)
    let dartData = { list: [] };
    try {
      const dartSearchRes = await fetch(`${WORKER_URL}/dart/search?name=${encodeURIComponent(stock.name)}`);
      if (dartSearchRes.ok) {
        dartData = await dartSearchRes.json();
      }
    } catch(e) { /* DART 실패해도 계속 진행 */ }

    // Groq 분석
    const analyzeRes = await fetch(`${WORKER_URL}/analyze`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        stockName: stock.name,
        stockCode: stock.code,
        sector: stock.sector,
        newsData,
        dartData
      })
    });

    if (!analyzeRes.ok) {
      const err = await analyzeRes.json().catch(() => ({}));
      throw new Error(err?.error?.message || `HTTP ${analyzeRes.status}`);
    }

    const groqData = await analyzeRes.json();
    if (groqData.error) throw new Error(groqData.error.message || 'Groq 오류');

    let raw = groqData.choices?.[0]?.message?.content || '';
    if (!raw) throw new Error('응답이 비어있습니다.');
    raw = raw.replace(/```json\n?/gi,'').replace(/```\n?/g,'').trim();
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('JSON 파싱 실패');
    const parsed = JSON.parse(jsonMatch[0]);
    parsed._newsCount = newsData.items.length;
    parsed._dartCount = (dartData?.list || []).length;
    parsed._query = query;

    const now = new Date();
    cache[activeId] = { data: parsed, updatedAt: now };

    // 히스토리 저장
    if (!history[activeId]) history[activeId] = [];
    history[activeId].unshift({ data: parsed, updatedAt: now.toISOString(), summary: parsed.summary });
    if (history[activeId].length > MAX_HISTORY) history[activeId] = history[activeId].slice(0, MAX_HISTORY);
    localStorage.setItem('sb_history', JSON.stringify(history));

    renderWatchlist();
    const stock2 = watchlist.find(s => s.id === activeId);
    if (stock2) renderResult(stock2, parsed, now);

  } catch (err) {
    showError(err.message);
    toast(`❌ ${err.message}`);
  } finally {
    isLoading = false;
  }
}

// ── RENDER ─────────────────────────────────────────────
function showWelcome() {
  document.getElementById('content').innerHTML = `
    <div class="welcome">
      <div class="welcome-icon">📰</div>
      <h2>관심종목을 선택하세요</h2>
      <p>좌측에서 종목을 추가하고 클릭하면<br>최신 뉴스·호재·악재를 분석합니다.</p>
    </div>`;
}

function showLoading(name) {
  document.getElementById('content').innerHTML = `
    <div class="loading-state">
      <div class="loading-text">[ ${escHtml(name)} 분석 중... ]</div>
      <div class="loading-bar"></div>
      <div style="font-family:'Nanum Gothic Coding',monospace;font-size:.6rem;color:var(--muted)">네이버 뉴스 수집 → Groq AI 분석</div>
    </div>`;
}

function showError(msg) {
  document.getElementById('content').innerHTML = `
    <div class="loading-state">
      <div style="font-size:2rem;opacity:.3">⚠️</div>
      <div style="font-family:'Nanum Gothic Coding',monospace;font-size:.72rem;color:var(--bad)">오류: ${escHtml(msg)}</div>
      <button onclick="retry()" style="margin-top:8px;background:var(--ink);color:var(--bg);border:none;font-family:'Nanum Gothic Coding',monospace;font-size:.65rem;padding:6px 16px;cursor:pointer">↻ 다시 시도</button>
    </div>`;
}

function retry() {
  const stock = watchlist.find(s => s.id === activeId);
  if (stock) fetchAnalysis(stock);
}

function renderResult(stock, d, updatedAt) {
  const newsHtml = renderItems(d.news || [], 'neutral');
  const prosHtml = renderItems(d.pros || [], 'good');
  const consHtml = renderItems(d.cons || [], 'bad');
  const discHtml = d.disclosures?.length ? renderItems(d.disclosures, 'dart') : null;
  const updStr = updatedAt instanceof Date ? updatedAt.toLocaleString('ko-KR') : new Date(updatedAt).toLocaleString('ko-KR');
  const hist = history[stock.id] || [];
  const memo = memos[stock.id] || '';

  document.getElementById('content').innerHTML = `
    <div class="article-head">
      <div class="article-eyebrow">관심종목 분석 리포트 ${stock.sector ? `· ${escHtml(stock.sector)}` : ''}</div>
      <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap">
        <div class="article-title">${escHtml(stock.name)}${stock.code ? `<span style="font-size:1rem;color:var(--muted);font-weight:400;margin-left:10px">${escHtml(stock.code)}</span>` : ''}</div>
        <button class="refresh-btn" onclick="refresh()">↻ 새로고침</button>
      </div>
      <div class="article-meta">
        <span>⚡ Groq llama-3.3-70b</span>
        ${d._newsCount > 0
          ? `<span style="color:var(--good)">📡 뉴스 ${d._newsCount}건</span>`
          : `<span style="color:var(--warn)">⚠️ 뉴스 없음</span>`}
        ${d._dartCount > 0
          ? `<span style="color:var(--accent2)">📋 공시 ${d._dartCount}건</span>`
          : ''}
        <span>🔍 검색어: ${escHtml(d._query||stock.name)}</span>
        <span>📅 ${updStr}</span>
        <span style="color:var(--bad);font-size:.56rem">※ 투자 권유 아님</span>
      </div>
    </div>

    <div class="columns">
      <div class="news-col">
        <div class="col-header"><div class="col-icon neutral">N</div><div class="col-title neutral">최신 뉴스</div></div>
        <div class="news-items">${newsHtml}</div>
      </div>
      <div class="news-col">
        <div class="col-header"><div class="col-icon good">▲</div><div class="col-title good">호재</div></div>
        <div class="news-items">${prosHtml}</div>
      </div>
      <div class="news-col">
        <div class="col-header"><div class="col-icon bad">▼</div><div class="col-title bad">악재</div></div>
        <div class="news-items">${consHtml}</div>
      </div>
    </div>

    ${discHtml ? `
    <div style="margin-bottom:16px">
      <div class="col-header"><div class="col-icon dart">D</div><div class="col-title dart">DART 공시</div></div>
      <div class="news-items">${discHtml}</div>
    </div>` : ''}

    ${d.summary ? `
    <div class="summary-bar">
      <div class="summary-label">한줄 요약</div>
      <div class="summary-text">${escHtml(d.summary)}</div>
    </div>` : ''}

    <!-- 메모 -->
    <div class="memo-section">
      <div class="memo-label">📝 종목 메모</div>
      <textarea class="memo-input" id="memoInput" placeholder="이 종목에 대한 메모를 남기세요...">${escHtml(memo)}</textarea>
      <button class="memo-save" onclick="saveMemo('${stock.id}')">저장</button>
    </div>

    <!-- 분석 히스토리 -->
    ${hist.length > 1 ? `
    <div class="history-section">
      <div class="history-title">📊 분석 히스토리 (최근 ${hist.length}회)</div>
      <div class="history-list">
        ${hist.slice(1).map((h, i) => `
        <div class="history-item" onclick="showHistory('${stock.id}', ${i+1})">
          <span class="history-date">${new Date(h.updatedAt).toLocaleString('ko-KR')}</span>
          <span class="history-summary">${escHtml(h.summary || '요약 없음')}</span>
        </div>`).join('')}
      </div>
    </div>` : ''}

    <div class="updated-badge">마지막 업데이트: ${updStr}</div>`;
}

function renderItems(items, type) {
  if (!items?.length) return `<div style="color:var(--muted);font-size:.7rem">항목 없음</div>`;
  return items.map(item => `
    <div class="news-item">
      <div class="news-headline">${escHtml(item.headline||'')}</div>
      <div class="news-desc">${escHtml(item.desc||'')}</div>
      ${item.tag ? `<span class="news-tag ${type}">${escHtml(item.tag)}</span>` : ''}
    </div>`).join('');
}

function refresh() {
  const stock = watchlist.find(s => s.id === activeId);
  if (!stock) return;
  delete cache[activeId];
  fetchAnalysis(stock);
}

// ── MEMO ───────────────────────────────────────────────
function saveMemo(id) {
  const val = document.getElementById('memoInput')?.value || '';
  memos[id] = val;
  localStorage.setItem('sb_memos', JSON.stringify(memos));
  toast('✓ 메모 저장됨');
}

function focusMemo(id, e) {
  e.stopPropagation();
  if (activeId !== id) selectStock(id);
  setTimeout(() => document.getElementById('memoInput')?.focus(), 300);
}

// ── HISTORY ────────────────────────────────────────────
function showHistory(stockId, idx) {
  const stock = watchlist.find(s => s.id === stockId);
  const h = history[stockId]?.[idx];
  if (!stock || !h) return;
  renderResult(stock, h.data, new Date(h.updatedAt));
  toast(`📊 ${new Date(h.updatedAt).toLocaleDateString('ko-KR')} 분석 데이터`);
}

// ── UTILS ──────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function timeSince(d) {
  const sec = Math.floor((Date.now() - new Date(d)) / 1000);
  if (sec < 60) return '방금';
  if (sec < 3600) return `${Math.floor(sec/60)}분 전`;
  if (sec < 86400) return `${Math.floor(sec/3600)}시간 전`;
  return `${Math.floor(sec/86400)}일 전`;
}
var toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
</body>
</html>
